# Evaluation Protocol Configuration
# Assignment: EE-5102/CS-6304 ATML Fall 2026 PA3 Task 2

development:
  scheduled_updates: [0, 500, 1000, 1500, 2000, 2250, 2500, 3000, 3500, 3750, 4000, 4500]
  caption_set_size: 96
  grounding_pairs: 24
  grounding_questions: 48
  vqav2_pairs: 32
  vqav2_questions: 64
  vqav2_breakdown:
    yes_no: 12
    number: 8
    other: 12
  conditions:
    - "correct"
    - "complementary_swap"
    - "no_image"

final_test:
  grounding_pairs: 64
  grounding_questions: 128
  vqav2_pairs: 96
  vqav2_questions: 192
  vqav2_breakdown:
    yes_no: 36
    number: 24
    other: 36
  conditions:
    - "correct"
    - "complementary_swap"
    - "mismatched"
    - "no_image"
  generation:
    max_new_tokens: 16
    batch_size: 8
    do_sample: false
    temperature: 0.0
    enable_thinking: false
  bootstrap:
    num_resamples: 4000
    confidence_level: 0.95
    resample_pairs: true
